<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GaurdAIN</title>
  <style>
    :root {
      --safe: #1a9c5b;
      --suspicious: #d99a1a;
      --high_risk: #d0021b;
      --ink: #1c2430;
      --muted: #6b7684;
    }
    body {
      width: 300px;
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #eef0f2;
    }
    header img { width: 22px; height: 22px; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }

    .status {
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted);
    }
    .dot.safe { background: var(--safe); }
    .dot.suspicious { background: var(--suspicious); }
    .dot.high_risk { background: var(--high_risk); }

    .status-text .label { font-size: 13px; font-weight: 600; text-transform: capitalize; }
    .status-text .host { font-size: 11px; color: var(--muted); word-break: break-all; }

    .details {
      padding: 0 16px 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .details div { margin-bottom: 4px; }
    .reasons {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .reasons span {
      background: #f2f4f6;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 10px;
      color: var(--ink);
    }
.controls {
      padding: 10px 16px;
      border-top: 1px solid #eef0f2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink);
    }
    .toggle-row input {
      width: 34px;
      height: 18px;
      accent-color: var(--safe);
    }
    .mode {
      font-size: 11px;
      color: var(--muted);
    }
    .mode.offline { color: #b00020; font-weight: 600; }
    .mode.online { color: var(--safe); font-weight: 600; }
    footer {
      padding: 10px 16px;
      border-top: 1px solid #eef0f2;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
<header>
    <img src="icon48.png" alt="" />
    <h1>GaurdAIN Shield</h1>
  </header>

  <div class="status">
    <div class="dot" id="dot"></div>
    <div class="status-text">
      <div class="label" id="label">Scanning…</div>
      <div class="host" id="host"></div>
    </div>
  </div>

  <div class="details" id="details"></div>

  <div class="controls">
<label class="toggle-row">
      <span>Local heuristic engine</span>
      <input type="checkbox" id="heuristicToggle" checked />
    </label>
    <div class="mode offline" id="offlineIndicator">◉ Autonomous offline mode</div>
  </div>

  <footer>Privacy-first fraud detection · no page data stored</footer>

  <script src="popup.js"></script>
</body>
</html>

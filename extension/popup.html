<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GuardAIN</title>
  <style>
    :root {
      --safe: #1a9c5b;
      --suspicious: #d99a1a;
      --high_risk: #d0021b;
      --ink: #1c2430;
      --muted: #6b7684;
    }
    body {
      width: 300px;
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #eef0f2;
    }
    header img { width: 22px; height: 22px; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }

    .status {
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted);
    }
    .dot.safe { background: var(--safe); }
    .dot.suspicious { background: var(--suspicious); }
    .dot.high_risk { background: var(--high_risk); }

    .status-text .label { font-size: 13px; font-weight: 600; text-transform: capitalize; }
    .status-text .host { font-size: 11px; color: var(--muted); word-break: break-all; }

    .details {
      padding: 0 16px 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .details div { margin-bottom: 4px; }
    .reasons {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .reasons span {
      background: #f2f4f6;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 10px;
      color: var(--ink);
    }
.controls {
      padding: 10px 16px;
      border-top: 1px solid #eef0f2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink);
    }
    .toggle-row input {
      width: 34px;
      height: 18px;
      accent-color: var(--safe);
    }
    .mode {
      font-size: 11px;
      color: var(--muted);
    }
    .mode.offline { color: #b00020; font-weight: 600; }
    .mode.online { color: var(--safe); font-weight: 600; }
    .message-tool { padding: 0 16px 14px; border-top: 1px solid #eef0f2; }
    .message-tool label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: 600; }
    .message-tool textarea { box-sizing: border-box; width: 100%; resize: vertical; border: 1px solid #d9dee5; border-radius: 6px; padding: 7px; font: 11px inherit; }
    .message-tool button { margin-top: 7px; border: 0; border-radius: 6px; padding: 7px 9px; color: #fff; background: #1c2430; cursor: pointer; font-size: 11px; }
    .server-config { padding: 12px 16px; border-top: 1px solid #eef0f2; }
    .server-config label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 600; }
    .server-config input { box-sizing: border-box; width: 100%; border: 1px solid #d9dee5; border-radius: 6px; padding: 7px; font-size: 11px; }
    .server-config button { margin-top: 7px; border: 0; border-radius: 6px; padding: 7px 9px; color: #fff; background: #2563eb; cursor: pointer; font-size: 11px; }
    #messageResult { margin-top: 7px; font-size: 11px; color: var(--muted); line-height: 1.35; }
    footer {
      padding: 10px 16px;
      border-top: 1px solid #eef0f2;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
<header>
    <img src="icon48.png" alt="" />
    <h1>GuardAIN Shield</h1>
  </header>

  <div class="status">
    <div class="dot" id="dot"></div>
    <div class="status-text">
      <div class="label" id="label">Scanning…</div>
      <div class="host" id="host"></div>
    </div>
  </div>

  <div class="details" id="details"></div>

  <div class="message-tool">
    <label for="messageInput">Message scam check</label>
    <textarea id="messageInput" rows="4" placeholder="Paste a suspicious SMS or chat message"></textarea>
    <button id="messageCheck" type="button">Break down message</button>
    <div id="messageResult" aria-live="polite"></div>
  </div>

  <div class="controls">
<label class="toggle-row">
      <span>Page protection</span>
      <input type="checkbox" id="heuristicToggle" checked />
    </label>
    <div class="mode offline" id="offlineIndicator">◉ Autonomous offline mode</div>
  </div>

  <div class="server-config">
    <label for="apiBaseInput">Central server HTTPS URL</label>
    <input id="apiBaseInput" type="url" placeholder="https://api.guardain.example" />
    <button id="saveApiBase" type="button">Save and test connection</button>
    <div id="apiBaseStatus" class="mode" aria-live="polite"></div>
  </div>

  <footer>Routine checks send domain and signals. High-risk reports may include a visible-tab screenshot; screenshots can contain personal data.</footer>

  <script src="popup.js"></script>
</body>
</html>

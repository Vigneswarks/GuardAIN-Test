<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuardAIN | Central Police Cyber Cell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            police: {
              950: '#0a0e27',
              900: '#111b3d',
              800: '#1a2d5c',
              700: '#2a3d7a',
              accent: '#0ea5e9',
              gold: '#fbbf24',
              danger: '#ef4444',
              safe: '#10b981',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; }
    .scanline { background: linear-gradient(0deg, transparent 24%, rgba(15, 165, 233, 0.05) 25%, rgba(15, 165, 233, 0.05) 26%, transparent 27%, transparent 74%, rgba(15, 165, 233, 0.05) 75%, rgba(15, 165, 233, 0.05) 76%, transparent 77%, transparent); background-size: 100% 4px; }
    .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), inset 0 0 20px rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.4); }
    .glow-danger { box-shadow: 0 0 20px rgba(239, 68, 68, 0.3), inset 0 0 20px rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4); }
    .glow-safe { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3), inset 0 0 20px rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.4); }
    .pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #111b3d; }
    ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #0284c7; }
    .input-field { background: #111b3d; border: 1px solid #2a3d7a; color: #e2e8f0; padding: 12px 16px; border-radius: 6px; transition: all 0.2s; }
    .input-field:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9, #06b6d4); border: none; color: white; padding: 10px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body class="min-h-screen bg-police-950 text-slate-100 antialiased scanline">

  <!-- Login Screen -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-police-950 via-police-900 to-police-800">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-gradient-to-br from-police-accent/20 to-police-accent/5 border border-police-accent/40 mb-4">
          <svg class="w-8 h-8 text-police-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m7 7a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">GuardAIN</h1>
        <p class="text-slate-400">Central Police Cyber Cell Portal</p>
      </div>

      <form id="loginForm" class="space-y-4 bg-police-900/60 backdrop-blur-xl border border-police-accent/20 rounded-xl p-8">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Username</label>
          <input type="text" id="username" placeholder="admin" class="w-full input-field" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
          <input type="password" id="password" placeholder="••••••••" class="w-full input-field" required>
        </div>
        <button type="submit" class="w-full btn-primary">LOGIN</button>
        <div id="loginError" class="hidden text-center text-red-400 text-sm mt-2"></div>
      </form>
      
      <p class="text-center text-xs text-slate-500 mt-6">Default: admin / admin@26</p>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" class="hidden">
    <!-- Header -->
    <header class="bg-police-900/80 backdrop-blur-md border-b border-police-accent/20 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-police-accent to-police-accent/60 flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M6.707 2.293a1 1 0 00-1.414 1.414l12 12a1 1 0 001.414-1.414l-12-12zM3 5a2 2 0 100 4 2 2 0 000-4zM15 15a2 2 0 100 4 2 2 0 000-4z" clip-rule="evenodd"/>
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-bold text-white">GuardAIN Cyber Cell</h1>
            <p class="text-xs text-slate-400">Threat Intelligence Command</p>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <div class="hidden sm:flex items-center space-x-2 text-sm text-slate-400">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span>System Online</span>
          </div>
          <button id="logoutBtn" class="px-4 py-2 rounded-lg border border-red-500/30 text-red-400 text-sm hover:bg-red-500/10">Logout</button>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="max-w-7xl mx-auto p-4">
      <!-- Stats Grid -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="glow-cyan bg-police-900/40 rounded-lg p-4">
          <div class="text-xs text-slate-400 mb-1">TOTAL SCANS</div>
          <div class="text-2xl font-bold text-police-accent" id="totalScans">0</div>
        </div>
        <div class="glow-safe bg-police-900/40 rounded-lg p-4">
          <div class="text-xs text-slate-400 mb-1">SAFE</div>
          <div class="text-2xl font-bold text-green-500" id="safeCount">0</div>
        </div>
        <div class="glow-danger bg-police-900/40 rounded-lg p-4">
          <div class="text-xs text-slate-400 mb-1">DANGEROUS</div>
          <div class="text-2xl font-bold text-red-500" id="dangerCount">0</div>
        </div>
        <div class="glow-cyan bg-police-900/40 rounded-lg p-4">
          <div class="text-xs text-slate-400 mb-1">SUCCESS RATE</div>
          <div class="text-2xl font-bold text-police-accent" id="successRate">0%</div>
        </div>
      </div>

      <!-- Scanner Section -->
      <div class="glow-cyan bg-police-900/40 rounded-lg p-6 mb-6">
        <h2 class="text-lg font-bold text-white mb-4 flex items-center">
          <svg class="w-5 h-5 mr-2 text-police-accent" fill="currentColor" viewBox="0 0 20 20">
            <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"/>
          </svg>
          Threat Scanner
        </h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-slate-300 mb-2">Enter URL to scan:</label>
            <div class="flex gap-2">
              <input type="url" id="scanUrl" placeholder="https://example.com" class="flex-1 input-field">
              <button id="scanBtn" class="btn-primary px-8">SCAN</button>
            </div>
          </div>

          <!-- Scanning Indicator -->
          <div id="scanningIndicator" class="hidden">
            <div class="flex items-center space-x-3 bg-police-800/30 rounded-lg p-4 border border-police-accent/30">
              <div class="animate-spin">
                <svg class="w-5 h-5 text-police-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
              <div>
                <p class="text-police-accent font-semibold">Scanning in progress...</p>
                <p class="text-xs text-slate-400">Analyzing threat patterns</p>
              </div>
            </div>
          </div>

          <!-- Result Display -->
          <div id="resultBox" class="hidden">
            <div id="resultContent" class="rounded-lg p-4 border-l-4"></div>
          </div>
        </div>
      </div>

      <!-- Recent Scans -->
      <div class="glow-cyan bg-police-900/40 rounded-lg p-6">
        <h2 class="text-lg font-bold text-white mb-4">Recent Scans</h2>
        <div id="scanHistory" class="space-y-2 max-h-96 overflow-y-auto">
          <p class="text-slate-400 text-sm">No scans yet</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = 'http://localhost:8080';
    let scanHistory = [];

    // Authentication
    const loginForm = document.getElementById('loginForm');
    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboard');
    const logoutBtn = document.getElementById('logoutBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      if (username === 'admin' && password === 'admin@26') {
        localStorage.setItem('token', 'authenticated');
        loginScreen.classList.add('hidden');
        dashboard.classList.remove('hidden');
        loadStats();
      } else {
        errorDiv.textContent = 'Invalid credentials';
        errorDiv.classList.remove('hidden');
        setTimeout(() => errorDiv.classList.add('hidden'), 3000);
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      location.reload();
    });

    // Check if already logged in
    if (localStorage.getItem('token') === 'authenticated') {
      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');
      loadStats();
    }

    // Scanner Functions
    const scanBtn = document.getElementById('scanBtn');
    const scanUrl = document.getElementById('scanUrl');
    const scanningIndicator = document.getElementById('scanningIndicator');
    const resultBox = document.getElementById('resultBox');
    const resultContent = document.getElementById('resultContent');

    scanBtn.addEventListener('click', async () => {
      const url = scanUrl.value.trim();
      if (!url) {
        alert('Please enter a URL');
        return;
      }

      scanBtn.disabled = true;
      scanBtn.textContent = 'SCANNING...';
      scanningIndicator.classList.remove('hidden');
      resultBox.classList.add('hidden');

      try {
        const response = await fetch(`${API_URL}/api/scan`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();
        displayResult(data, url);
        addToHistory(url, data);
        loadStats();
      } catch (error) {
        console.error('Scan error:', error);
        displayResult({ status: 'error', message: error.message }, url);
      } finally {
        scanBtn.disabled = false;
        scanBtn.textContent = 'SCAN';
        scanningIndicator.classList.add('hidden');
      }
    });

    function displayResult(data, url) {
      const isSafe = data.status === 'safe' || data.threat_score < 5;
      const resultHTML = `
        <div class="flex items-start justify-between">
          <div class="flex items-start space-x-3 flex-1">
            <div class="mt-1">
              ${isSafe ? `<svg class="w-6 h-6 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>` : `<svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>`}
            </div>
            <div>
              <p class="font-semibold ${isSafe ? 'text-green-500' : 'text-red-500'}">${isSafe ? '✓ SAFE' : '⚠ DANGEROUS'}</p>
              <p class="text-xs text-slate-400 mt-1">${url}</p>
              ${data.details ? `<p class="text-sm text-slate-300 mt-2">${data.details}</p>` : ''}
            </div>
          </div>
          <div class="text-right ml-4">
            <p class="text-2xl font-bold ${isSafe ? 'text-green-500' : 'text-red-500'}">${data.threat_score || (isSafe ? '0' : '9')}/10</p>
            <p class="text-xs text-slate-400">Threat Score</p>
          </div>
        </div>
      `;
      
      resultContent.innerHTML = resultHTML;
      resultContent.className = `rounded-lg p-4 border-l-4 ${isSafe ? 'bg-green-500/10 border-green-500' : 'bg-red-500/10 border-red-500'}`;
      resultBox.classList.remove('hidden');
    }

    function addToHistory(url, result) {
      const isSafe = result.status === 'safe' || result.threat_score < 5;
      scanHistory.unshift({ url, isSafe, timestamp: new Date() });
      scanHistory = scanHistory.slice(0, 10);
      updateHistory();
    }

    function updateHistory() {
      const historyDiv = document.getElementById('scanHistory');
      if (scanHistory.length === 0) {
        historyDiv.innerHTML = '<p class="text-slate-400 text-sm">No scans yet</p>';
        return;
      }
      historyDiv.innerHTML = scanHistory.map((item, i) => `
        <div class="flex items-center justify-between bg-police-800/30 rounded p-3 border border-police-accent/10">
          <div class="flex items-center space-x-3 flex-1">
            ${item.isSafe ? `<span class="w-2 h-2 bg-green-500 rounded-full"></span>` : `<span class="w-2 h-2 bg-red-500 rounded-full"></span>`}
            <p class="text-sm text-slate-300 truncate">${item.url}</p>
          </div>
          <p class="text-xs ${item.isSafe ? 'text-green-400' : 'text-red-400'}">${item.isSafe ? 'SAFE' : 'DANGER'}</p>
        </div>
      `).join('');
    }

    function loadStats() {
      const safe = scanHistory.filter(s => s.isSafe).length;
      const danger = scanHistory.filter(s => !s.isSafe).length;
      const total = scanHistory.length;
      const rate = total > 0 ? Math.round((safe / total) * 100) : 0;

      document.getElementById('totalScans').textContent = total;
      document.getElementById('safeCount').textContent = safe;
      document.getElementById('dangerCount').textContent = danger;
      document.getElementById('successRate').textContent = rate + '%';
    }

    // Allow Enter key to scan
    scanUrl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') scanBtn.click();
    });
  </script>
</body>
</html>

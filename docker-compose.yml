services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    volumes: [redis-data:/data]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: guardain, POSTGRES_PASSWORD: guardain, POSTGRES_DB: guardain}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U guardain -d guardain"], interval: 5s, timeout: 3s, retries: 10}
    volumes: [postgres-data:/var/lib/postgresql/data]
  api:
    build: {context: ., dockerfile: Dockerfile}
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment}
      ENVIRONMENT: production
      PORT: "8080"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the environment}
      GUARDAIN_ADMIN_PASSWORD: ${GUARDAIN_ADMIN_PASSWORD:?Set GUARDAIN_ADMIN_PASSWORD in the environment}
    volumes: ["./data:/app/data", "./backend/models:/app/backend/models"]
volumes:
  redis-data:
  postgres-data:
